[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-critical]
command=php /var/www/html/artisan queue:work redis --queue=meta-webhooks,message-send --sleep=1 --tries=5 --backoff=5,15,60 --max-time=3600
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-bulk]
command=php /var/www/html/artisan queue:work redis --queue=campaigns,meta-api,template-sync,waba-sync,notifications,analytics --sleep=2 --tries=3 --backoff=10,60,300 --max-time=3600
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
